command:
  - "python"
  - "app.py"

resources:
  - name: requirements
    source:
      path: ./requirements.txt

env:
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"
  - name: TMDB_SECRET_SCOPE
    value: "database"
  - name: TMDB_API_KEY_SECRET
    value: "tmdb-api-key"
  - name: DEFAULT_USER_EMAIL
    value: "user@example.com"